<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatGPT Preference Studio</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#183355;background:#f4f8fd}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{background:#123f79;color:white;padding:23px max(22px,calc((100vw - 1240px)/2));display:flex;justify-content:space-between;gap:20px;align-items:center}.top h1{font-size:26px;margin:0 0 4px}.top p{margin:0;color:#d5e6fa;font-size:13px}.badge{border:1px solid #8fb6e2;color:#e0efff;padding:8px 12px;border-radius:30px;font-size:12px;white-space:nowrap}.layout{max-width:1240px;margin:25px auto;padding:0 18px;display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px}.side,.main{background:#fff;border:1px solid #d8e6f4;border-radius:16px;box-shadow:0 6px 22px #163d7010}.side{padding:17px;align-self:start;position:sticky;top:15px}.side h2{font-size:12px;text-transform:uppercase;color:#66829d;letter-spacing:.09em;margin:6px 7px 13px}.nav{display:block;width:100%;border:0;background:none;color:#355370;text-align:left;border-radius:10px;padding:12px 10px;margin:3px 0;line-height:1.35}.nav strong{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:8px;background:#e5f0fc;color:#194e89;margin-right:8px}.nav.active{background:#e8f2ff;color:#123f79;font-weight:700}.nav.active strong{background:#1c67b3;color:white}.main{padding:27px 30px}.eyebrow{color:#2470bd;text-transform:uppercase;letter-spacing:.09em;font-size:12px;font-weight:700}.main h2{font-size:25px;margin:7px 0}.intro{color:#647d95;margin:0 0 20px;line-height:1.5}.card{border:1.5px solid #bad8f3;background:#f2f8ff;border-radius:13px;margin:15px 0;padding:18px 20px;transition:.2s}.card:focus-within{border-color:#2874c8;box-shadow:0 0 0 3px #d5e9ff}.cardhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.num{background:#d9ebff;color:#145698;border:1px solid #a4cdf3;border-radius:9px;min-width:42px;height:32px;display:grid;place-items:center;font-size:13px;font-weight:800}.card label.title{font-size:16px;font-weight:700}.help{border:1px solid #aacdea;border-radius:50%;width:25px;height:25px;background:#fff;color:#185e9f;font-weight:800}.hint{display:none;margin:0 0 13px;padding:12px 14px;background:white;border-left:3px solid #3986d2;border-radius:6px;color:#45647e;line-height:1.45;font-size:13px}.hint.open{display:block}.control{width:100%;border:1px solid #b8cde2;border-radius:8px;background:#fff;padding:10px 12px;color:#1c3e60}.control:focus{outline:2px solid #559be2}textarea.control{min-height:84px;resize:vertical}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1px solid #b7d2ed;border-radius:8px;background:white;color:#2b5d8b;padding:10px 13px}.choice.selected{background:#1c67b3;border-color:#1c67b3;color:white;font-weight:700}.sub{font-size:12px;color:#6a8199;margin:9px 0 0}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:26px;border-top:1px solid #e2ebf4;padding-top:20px}.btn{background:#1c67b3;color:white;border:1px solid #1c67b3;border-radius:9px;padding:11px 17px;font-weight:700}.btn.secondary{background:#fff;color:#195b9d}.btn:disabled{opacity:.4;cursor:default}.notice{font-size:13px;color:#5c7892}.preview{white-space:pre-wrap;word-break:break-word;background:#0d2949;color:#d6ebff;border-radius:10px;padding:18px;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;max-height:400px;overflow:auto}.project{border:1px solid #c5dbef;background:#fbfdff;border-radius:12px;padding:16px 18px;margin-bottom:22px}.project h3{margin:0 0 12px;font-size:17px}.project .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.project label{display:block;font-size:13px;font-weight:650;margin:0 0 5px}.project textarea{min-height:66px}.foot{max-width:1240px;margin:0 auto 25px;padding:0 18px;color:#6a8199;font-size:12px}.sr{position:absolute;left:-9999px}@media(max-width:850px){.layout{display:block}.side{position:static;margin-bottom:16px}.nav{display:inline-block;width:auto}.main{padding:20px}.project .grid{grid-template-columns:1fr}.top{padding:19px}.badge{display:none}}
</style></head><body><header class="top"><div><h1>ChatGPT Preference Studio</h1><p>Choose how ChatGPT should approach your project</p></div><span class="badge">Browser prototype · No API</span></header><div class="layout"><aside class="side"><h2>Six forms</h2><nav id="nav"></nav></aside><main class="main"><div class="project"><h3>Your project</h3><div class="grid"><div><label for="projectTitle">Project title</label><input class="control" id="projectTitle" placeholder="e.g. My project" value="My project"></div><div><label for="projectOutput">What do you want back?</label><input class="control" id="projectOutput" placeholder="e.g. A report and an HTML prototype"></div></div><div style="margin-top:11px"><label for="projectTask">What should ChatGPT do?</label><textarea class="control" id="projectTask" placeholder="Describe the task in your own words"></textarea></div></div><div class="eyebrow" id="formCount"></div><h2 id="formTitle"></h2><p class="intro" id="formIntro"></p><div id="fields"></div><div class="actions"><button class="btn secondary" id="back">Previous</button><span class="notice" id="status"></span><button class="btn" id="next">Next form</button></div></main></div><p class="foot">Settings become written project guidance. They do not change ChatGPT's temperature, internal reasoning effort, or access to files. Your draft stays in this browser.</p><script>
const forms=[
{name:'AI Analysis Preferences',intro:'Choose how ChatGPT should examine questions and compare approaches.',fields:[
['Analysis depth','select',['Quick','Balanced','Thorough'],'Balanced','How carefully should ChatGPT examine the task? Quick gives a direct answer; Thorough examines important assumptions and tradeoffs.'],
['Perspectives','lines',null,'','Enter viewpoints one per line, such as visitor, business, operations, finance, technical, or cultural. Leave blank if none are needed.'],
['Alternatives to compare','select',['One approach','Two to three','Several'],'Two to three','Choose how many workable approaches ChatGPT should compare before recommending one.'],
['Assumption handling','select',['State key assumptions','Challenge key assumptions','Use provided assumptions'],'State key assumptions','Tell ChatGPT whether to label important assumptions or actively question them.'],
['Missing information','select',['Ask first','Proceed with stated assumptions','Ask only if essential'],'Ask only if essential','Choose whether ChatGPT should pause for missing facts or continue with clearly labeled assumptions.'],
['Decision criteria','lines',null,'Accuracy\nFeasibility','Enter what matters when judging options, one criterion per line. Examples: cost, speed, accessibility, usability.'],
['Uncertainty handling','select',['Brief','Explicit','Detailed'],'Explicit','Choose how visibly ChatGPT should distinguish facts from estimates or open questions.'],
['Review and checks','lines',null,'Consistency\nRequirements','Enter checks one per line, such as calculations, consistency, requirements, or counterarguments.']]},
{name:'Creativity and Innovation',intro:'Choose how broadly ChatGPT should explore and develop ideas.',fields:[
['Creative exploration','select',['Focused','Balanced','Exploratory'],'Balanced','Focused stays close to established approaches; Exploratory invites less obvious possibilities.'],['Originality target','select',['Familiar','Fresh','Unconventional'],'Fresh','Choose how different the ideas should feel from familiar examples. This does not guarantee uniqueness.'],['Idea quantity','select',['1','3','5','Custom'],'3','How many initial concepts should ChatGPT develop?'],['Cross domain inspiration','select',['None','Relevant connections','Broad connections'],'Relevant connections','Ask ChatGPT to find useful patterns from other fields when relevant.'],['Inspiration domains','lines',null,'','Optionally name fields to draw inspiration from, one per line.'],['Constraint flexibility','select',['Strict','Explore within limits','Suggest exceptions separately'],'Explore within limits','Keep ideas within project constraints, or show possible exceptions separately for review.'],['Risk appetite for ideas','select',['Conservative','Balanced','Bold'],'Balanced','Choose how ambitious the ideas should be while labeling important practical risks.'],['Creative development mode','select',['Generate only','Generate and refine','Build on my idea'],'Generate and refine','Choose whether to brainstorm, refine promising ideas, or develop an idea you provide.'],['Starting idea','text',null,'','If you chose Build on my idea, write your starting concept here.']]},
{name:'Knowledge and Context',intro:'Tell ChatGPT what information to consider and which facts still need checking.',fields:[
['Project background','text',null,'','Add background that affects the task.'],['Reference documents','lines',null,'','List filenames and why they matter, one per line. Attach the actual files separately in ChatGPT.'],['Source priority','select',['Supplied files first','User input first','Balanced'],'Balanced','If sources disagree, which should ChatGPT examine first? Conflicts should still be reported.'],['Knowledge boundary','select',['Supplied information only','General knowledge permitted','Ask before outside research'],'General knowledge permitted','Choose whether ChatGPT may use background knowledge beyond what you supply.'],['Facts to verify','lines',null,'','List uncertain statements or estimates one per line.'],['Context exclusions','lines',null,'','Name superseded or irrelevant material that should be excluded.'],['Time and location context','text',null,'','Specify a relevant date, region, language, or cultural setting.']]},
{name:'AI Behavior and Instructions',intro:'Set the role, audience, language, and working relationship.',fields:[
['Working role','select',['Researcher','Analyst','Editor','Designer','Project assistant','Custom'],'Project assistant','Choose the useful project role; it does not confer professional qualifications.'],['Custom role','short',null,'','If Custom is selected, specify the role.'],['Audience','short',null,'General professional audience','Who will read or use the output?'],['Language','short',null,'English','Choose the writing language and locale if needed.'],['Tone and voice','select',['Conversational','Professional','Academic','Creative'],'Professional','Choose how the result should sound.'],['Interaction style','select',['Ask at milestones','Work through first draft','Collaborate section by section'],'Work through first draft','Choose when ChatGPT should pause for your feedback.'],['Additional instructions','lines',null,'','Add specific project instructions, one per line.'],['Terminology','lines',null,'','Define preferred terms, one per line: Term — meaning.']]},
{name:'Output and Deliverables',intro:'Describe what you want back and how you will judge it.',fields:[
['Deliverables','lines',null,'Written response','List each output you need, one per line.'],['Output format','select',['Chat text','Table','HTML','JSON','Document','Presentation','Other'],'Chat text','Select the requested format. Availability of file creation depends on the ChatGPT conversation.'],['Structure','lines',null,'','List headings or sections in order.'],['Detail level','select',['Brief','Standard','Detailed'],'Standard','Choose how much explanation the final response should contain.'],['Tables and visuals','select',['When helpful','Required','Avoid'],'When helpful','Choose whether tables or visuals would help the result.'],['Acceptance criteria','lines',null,'','List conditions the work must satisfy, one per line.'],['Citation expectations','select',['None','Cite supplied material','Cite external sources when used'],'Cite supplied material','ChatGPT can only cite material it has and can identify.']]},
{name:'Execution and Workflow',intro:'Set the work stages, review points, and final checks.',fields:[
['Work stages','lines',null,'Understand\nDraft\nReview','List stages in order, one per line.'],['Stage gate','select',['Pause after every stage','Pause at named milestones','Continue unless blocked'],'Continue unless blocked','When should ChatGPT wait for your feedback?'],['Named milestones','lines',null,'','If selected above, list the stages that require a pause.'],['Progress updates','select',['Brief milestones','At each stage','Final only'],'Brief milestones','How often should ChatGPT explain its progress? This does not make a live dashboard.'],['Validation checklist','lines',null,'Against requirements\nInternal consistency','List the checks to perform before presenting the result.'],['Revision cycle','select',['One draft','Draft then user review','Iterative sections'],'Draft then user review','Choose how the output should be refined.'],['Completion rule','text',null,'All requested deliverables provided and checks reported','What concrete result means this task is complete?'],['Open items log','select',['Include','Only material gaps','Omit'],'Only material gaps','Should unresolved questions appear at the end?']]}];
const keys=[['analysisDepth','perspectives','alternativesToCompare','assumptionHandling','missingInformationPolicy','decisionCriteria','uncertaintyHandling','reviewChecks'],['creativeExploration','originalityTarget','ideaQuantity','crossDomainInspiration','inspirationDomains','constraintFlexibility','ideaRiskAppetite','creativeDevelopmentMode','startingIdea'],['projectBackground','referenceInventory','sourcePriority','knowledgeBoundary','factRegister','contextExclusions','timeLocationContext'],['workingRole','customRole','audience','language','toneVoice','interactionStyle','additionalInstructions','terminology'],['deliverables','outputFormat','structure','detailLevel','visualPreference','acceptanceCriteria','citationExpectation'],['workStages','stageGate','milestones','progressUpdates','validationChecklist','revisionCycle','completionRule','openItemsLog']];
const groupKeys=['reasoningPreferences','creativityPreferences','knowledgePreferences','behaviorPreferences','outputPreferences','workflowPreferences'];let active=0;const state=JSON.parse(localStorage.getItem('chatgpt-preference-studio-v1')||'{}');if(!state.answers)state.answers={};const $=id=>document.getElementById(id);function save(){state.title=$('projectTitle').value;state.task=$('projectTask').value;state.output=$('projectOutput').value;localStorage.setItem('chatgpt-preference-studio-v1',JSON.stringify(state))}for(const [id,key] of [['projectTitle','title'],['projectTask','task'],['projectOutput','output']]){if(state[key])$(id).value=state[key];$(id).addEventListener('input',save)}function get(i,j){return state.answers[`${i}.${j}`]??forms[i].fields[j][3]}function set(i,j,v){state.answers[`${i}.${j}`]=v;save()}function render(){const f=forms[active];$('formCount').textContent=`FORM ${active+1} OF 6`;$('formTitle').textContent=f.name;$('formIntro').textContent=f.intro;$('nav').innerHTML='';forms.forEach((x,i)=>{let b=document.createElement('button');b.type='button';b.className='nav'+(i===active?' active':'');b.innerHTML=`<strong>${i+1}</strong>${x.name}`;b.onclick=()=>{active=i;render();scrollTo(0,0)};$('nav').append(b)});$('fields').innerHTML='';f.fields.forEach(([label,type,options,def,help],j)=>{let card=document.createElement('section');card.className='card';let head=document.createElement('div');head.className='cardhead';let number=document.createElement('span');number.className='num';number.textContent=`${active+1}.${j+1}`;let title=document.createElement('label');title.className='title';title.textContent=label;title.id=`label-${active}-${j}`;let hb=document.createElement('button');hb.type='button';hb.className='help';hb.textContent='?';hb.setAttribute('aria-label',`Help for ${label}`);hb.setAttribute('aria-expanded','false');head.append(number,title,hb);let hint=document.createElement('p');hint.className='hint';hint.textContent=help;hb.onclick=()=>{let on=hint.classList.toggle('open');hb.setAttribute('aria-expanded',on)};card.append(head,hint);if(type==='select'){let row=document.createElement('div');row.className='choices';row.setAttribute('role','group');row.setAttribute('aria-labelledby',title.id);options.forEach(opt=>{let b=document.createElement('button');b.type='button';b.className='choice'+(get(active,j)===opt?' selected':'');b.textContent=opt;b.setAttribute('aria-pressed',get(active,j)===opt?'true':'false');b.onclick=()=>{set(active,j,opt);row.querySelectorAll('button').forEach(c=>{c.classList.toggle('selected',c===b);c.setAttribute('aria-pressed',c===b?'true':'false')})};row.append(b)});card.append(row)}else{let input=document.createElement(type==='short'?'input':'textarea');input.className='control';input.id=`field-${active}-${j}`;title.htmlFor=input.id;if(type==='short')input.type='text';input.value=get(active,j);input.placeholder=type==='lines'?'One item per line':'Your answer';input.addEventListener('input',()=>set(active,j,input.value));card.append(input);if(type==='lines'){let sm=document.createElement('p');sm.className='sub';sm.textContent='One item per line';card.append(sm)}}$('fields').append(card)});$('back').disabled=active===0;$('next').textContent=active===5?'Review & download':'Next form';$('status').textContent=`${f.fields.length} numbered options`;if(active===6)renderReview()}
function lines(v){return String(v||'').split('\n').map(x=>x.trim()).filter(Boolean)}
const maps={analysisDepth:{Quick:'quick',Balanced:'balanced',Thorough:'thorough'},alternativesToCompare:{'One approach':'one','Two to three':'two_to_three',Several:'several'},assumptionHandling:{'State key assumptions':'state_key','Challenge key assumptions':'challenge_key','Use provided assumptions':'use_provided'},missingInformationPolicy:{'Ask first':'ask_first','Proceed with stated assumptions':'proceed_with_assumptions','Ask only if essential':'ask_if_essential'},uncertaintyHandling:{Brief:'brief',Explicit:'explicit',Detailed:'detailed'},creativeExploration:{Focused:'focused',Balanced:'balanced',Exploratory:'exploratory'},originalityTarget:{Familiar:'familiar',Fresh:'fresh',Unconventional:'unconventional'},crossDomainInspiration:{None:'none','Relevant connections':'relevant','Broad connections':'broad'},constraintFlexibility:{Strict:'strict','Explore within limits':'within_limits','Suggest exceptions separately':'exceptions_separately'},ideaRiskAppetite:{Conservative:'conservative',Balanced:'balanced',Bold:'bold'},creativeDevelopmentMode:{'Generate only':'generate_only','Generate and refine':'generate_and_refine','Build on my idea':'build_on_my_idea'},sourcePriority:{'Supplied files first':'supplied_files_first','User input first':'user_input_first',Balanced:'balanced'},knowledgeBoundary:{'Supplied information only':'supplied_only','General knowledge permitted':'general_knowledge','Ask before outside research':'ask_before_research'},workingRole:{Researcher:'researcher',Analyst:'analyst',Editor:'editor',Designer:'designer','Project assistant':'project_assistant',Custom:'custom'},toneVoice:{Conversational:'conversational',Professional:'professional',Academic:'academic',Creative:'creative'},interactionStyle:{'Ask at milestones':'ask_at_milestones','Work through first draft':'work_through_first_draft','Collaborate section by section':'section_by_section'},outputFormat:{'Chat text':'chat_text',Table:'table',HTML:'html',JSON:'json',Document:'document',Presentation:'presentation',Other:'other'},detailLevel:{Brief:'brief',Standard:'standard',Detailed:'detailed'},visualPreference:{'When helpful':'when_helpful',Required:'required',Avoid:'avoid'},citationExpectation:{None:'none','Cite supplied material':'supplied_material','Cite external sources when used':'external_when_used'},stageGate:{'Pause after every stage':'every_stage','Pause at named milestones':'named_milestones','Continue unless blocked':'continue_unless_blocked'},progressUpdates:{'Brief milestones':'brief_milestones','At each stage':'each_stage','Final only':'final_only'},revisionCycle:{'One draft':'one_draft','Draft then user review':'draft_then_review','Iterative sections':'iterative_sections'},openItemsLog:{Include:'include','Only material gaps':'material_only',Omit:'omit'}};
function object(){let groups={};forms.forEach((f,i)=>{let g={};f.fields.forEach(([label,type],j)=>{let v=get(i,j),key=keys[i][j];if(type==='lines')v=lines(v);if(maps[key])v=maps[key][v];if(key==='ideaQuantity')v=v==='Custom'?3:Number(v);if(key==='reviewChecks')v=v.map(x=>({Consistency:'consistency',Calculations:'calculations',Requirements:'requirements',Counterarguments:'counterarguments'}[x]||null)).filter(Boolean);if(key==='referenceInventory')v=v.map(x=>({fileName:x.split(' — ')[0].trim(),purpose:x.includes(' — ')?x.split(' — ').slice(1).join(' — ').trim():'User supplied reference',attachedInChat:false}));if(key==='factRegister')v=v.map(x=>({statement:x,status:'to_verify'}));if(key==='timeLocationContext')v=v?{region:v}:{};if(key==='terminology')v=v.map(x=>({term:x.split(' — ')[0].trim(),meaning:x.includes(' — ')?x.split(' — ').slice(1).join(' — ').trim():'User defined term'}));if(key==='deliverables')v=v.map(x=>({name:x,purpose:x,format:maps.outputFormat[get(4,1)],acceptanceCriteria:[]}));if(key==='acceptanceCriteria'&&i===4)v=v;if(key==='startingIdea'&&g.creativeDevelopmentMode!=='build_on_my_idea')return;if(key==='customRole'&&g.workingRole!=='custom')return;if(key==='milestones'&&g.stageGate!=='named_milestones')return;if((v===''||Array.isArray(v)&&!v.length)&&!['perspectives','decisionCriteria','reviewChecks','inspirationDomains','referenceInventory','factRegister','contextExclusions','additionalInstructions','terminology','structure','acceptanceCriteria','milestones'].includes(key))return;g[key]=v});if(i===1&&g.creativeDevelopmentMode==='build_on_my_idea'&&!g.startingIdea)g.startingIdea='Please ask for my starting idea.';if(i===1&&g.ideaQuantity>20)g.ideaQuantity=20;if(i===3&&g.workingRole==='custom'&&!g.customRole)g.customRole='Project assistant';if(i===4&&!g.deliverables.length)g.deliverables=[{name:'Written response',purpose:'Answer the project request',format:'chat_text',acceptanceCriteria:[]}];if(i===5&&g.stageGate==='named_milestones'&&!g.milestones?.length)g.milestones=['After the first draft'];groups[groupKeys[i]]=g});let task=$('projectTask').value.trim(),output=$('projectOutput').value.trim();let summary=`Read this APS as the project brief. Task: ${task||'Please ask for the project task.'} Requested output: ${output||'Written response'}. Analysis: ${get(0,0)}; creativity: ${get(1,0)}. Follow the project preferences and report material assumptions.`;return{metadata:{apsVersion:'0.1-draft',projectId:'project-'+Date.now(),title:$('projectTitle').value||'Untitled project',createdDate:new Date().toISOString().slice(0,10),revision:1},project:{summary:task||'Project brief to be completed',objective:task||'Project objective to be completed',requirements:[],constraints:[],expectedOutputs:lines(output.replaceAll(',', '\n')).length?lines(output.replaceAll(',', '\n')):['Written response'],validationRules:lines(get(5,4))},preferences:groups,instructionSummary:summary}}
function renderReview(){let area=$('fields');area.innerHTML='';let h=document.createElement('h3');h.textContent='Review your preferences';area.append(h);let p=document.createElement('p');p.className='intro';p.textContent='Download the APS as project.json, or copy its content and paste it into ChatGPT with your task.';area.append(p);let pre=document.createElement('pre');pre.className='preview';pre.textContent=JSON.stringify(object(),null,2);area.append(pre);let box=document.createElement('div');box.className='choices';let copy=document.createElement('button');copy.className='btn secondary';copy.textContent='Copy JSON';copy.onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(object(),null,2));copy.textContent='Copied'};let dl=document.createElement('button');dl.className='btn';dl.textContent='Download project.json';dl.onclick=()=>{let blob=new Blob([JSON.stringify(object(),null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='project.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};box.append(copy,dl);area.append(box);$('status').textContent='Review before uploading';$('next').style.display='none'}$('back').onclick=()=>{active=Math.max(0,active-1);$('next').style.display='';render()};$('next').onclick=()=>{active++;if(active===6){$('formCount').textContent='FINAL STEP';$('formTitle').textContent='Review and export';$('formIntro').textContent='Your answers are ready to bring into ChatGPT.';$('nav').querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));renderReview();scrollTo(0,0)}else{render();scrollTo(0,0)}};render();
</script></body></html>
